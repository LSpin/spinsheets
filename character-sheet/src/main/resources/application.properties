spring.application.name=character-sheet

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vtm_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — MUST be set via JWT_SECRET env var
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# Mail — MUST be set via env vars in production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notify-email=${NOTIFY_EMAIL:}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
