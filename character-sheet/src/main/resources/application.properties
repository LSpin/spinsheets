spring.application.name=character-sheet

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vtm_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:vtm-character-sheet-secret-key-change-in-production-at-least-256-bits-long!!}
jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
