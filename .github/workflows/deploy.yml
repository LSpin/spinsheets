name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build frontend
        working-directory: vtm-frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend to Spring Boot static
        run: |
          rm -rf character-sheet/src/main/resources/static/assets
          cp -r vtm-frontend/dist/* character-sheet/src/main/resources/static/

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        working-directory: character-sheet
        run: ./mvnw package -DskipTests -q

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          scp -o StrictHostKeyChecking=no -i key.pem \
            character-sheet/target/*.jar ubuntu@$EC2_HOST:/opt/spinsheets/app.jar
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            sudo tee /etc/caddy/Caddyfile > /dev/null <<'EOF'
          spinsheets.com {
              reverse_proxy localhost:8080
          }
          EOF
            sudo systemctl reload caddy
            sudo systemctl restart spinsheets
          ENDSSH
          rm key.pem
